[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careerflow-vercel-document-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "careerflow-kit[documents] @ git+https://github.com/yihan498/careerflow.git@codex/web-platform",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
]

[project.scripts]
app = "document_worker.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["document_worker*"]
