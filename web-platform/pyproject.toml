[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careerflow-web-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "asyncpg>=0.29,<1",
  "aiosqlite>=0.20,<1",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "cryptography>=43,<46",
  "PyJWT[crypto]>=2.9,<3",
  "boto3>=1.35,<2",
  "python-multipart>=0.0.12,<1",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
documents = ["PyMuPDF>=1.24,<2", "Pillow>=10,<12", "reportlab>=4,<5"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "respx>=0.21,<1"]

[project.scripts]
app = "api.main:app"

[tool.vercel.scripts]
build = "npm --prefix frontend ci && npm --prefix frontend run build"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "shared*", "document_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
